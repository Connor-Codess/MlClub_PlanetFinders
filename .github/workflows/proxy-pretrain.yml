# Proxy pretraining (experiments/proxy_pretrain): one job per pretraining-data variant packs about
# 400,000 lc-pretrain windows and pretrains the small detector's encoder by masked reconstruction.
#
# Start it by editing experiments/proxy_pretrain/run_request.json and pushing, or from the Actions tab.
# Requires the HF_TOKEN secret (the lc-benchmarks star list used for exclusion is private).
# Results: one "pretrained-<variant>" artifact per variant (<variant>.pt and metrics.json). The
# data mix experiments read them through "pretrain_run_id" in their own run_request.json.

name: Proxy pretraining

on:
  workflow_dispatch:
  push:
    branches: [main, reference-catalogs]
    paths:
      - "experiments/proxy_pretrain/run_request.json"

permissions:
  contents: read

concurrency:
  group: proxy-pretrain-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  REQUEST: experiments/proxy_pretrain/run_request.json

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: experiments
      - id: plan
        run: echo "variants=$(python3 -c "import json; print(json.dumps(json.load(open('$REQUEST'))['variants']))")" >> "$GITHUB_OUTPUT"

  pretrain:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            experiments
            pretrain_dataset
            tests
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: experiments/finetune_mix/requirements.txt
      - run: |
          pip install -r experiments/finetune_mix/requirements.txt pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Offline tests
        run: python -m pytest tests/test_finetune_mix.py tests/test_proxy_pretrain.py -q
      - name: Pack ${{ matrix.variant }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          windows=$(python -c "import json; print(json.load(open('$REQUEST')).get('windows') or '')")
          python -m experiments.proxy_pretrain.pack --variant "${{ matrix.variant }}" \
            --out "build/pretrain/${{ matrix.variant }}" ${windows:+--windows "$windows"}
          df -h /
      - name: Pretrain ${{ matrix.variant }}
        run: |
          steps=$(python -c "import json; print(json.load(open('$REQUEST')).get('steps') or '')")
          python -m experiments.proxy_pretrain.pretrain --data "build/pretrain/${{ matrix.variant }}" \
            --variant "${{ matrix.variant }}" --out build/pretrain/out --max-minutes 280 ${steps:+--steps "$steps"}
      - uses: actions/upload-artifact@v4
        with:
          name: pretrained-${{ matrix.variant }}
          path: build/pretrain/out
          retention-days: 30
