# Builds the Step 0 reference catalogs on a GitHub-hosted runner and publishes
# them to https://huggingface.co/datasets/nyu-planet-finders/reference-catalogs.
#
# Requires the repository secret HF_TOKEN: a Hugging Face token with write
# access to the nyu-planet-finders organization (Settings > Secrets and
# variables > Actions > New repository secret). Without it the catalogs are
# still built and attached to the run as an artifact, and the upload step is
# skipped with a warning; re-run the workflow after adding the secret.

name: Build reference catalogs

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated catalog names to build (empty = all)"
        required: false
        default: ""
  push:
    branches: [main, reference-catalogs]
    paths:
      - "reference_catalogs/**"
      - "tests/test_reference_catalogs.py"
      - ".github/workflows/build-reference-catalogs.yml"
  schedule:
    - cron: "23 7 1 * *"   # monthly refresh of the TOI table and the crossmatch

permissions:
  contents: read

concurrency:
  group: reference-catalogs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OUT_DIR: build/reference_catalogs
      HF_REPO: nyu-planet-finders/reference-catalogs
    steps:
      - name: Check out the code only (the light-curve CSVs are not needed)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            reference_catalogs
            tests
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reference_catalogs/requirements.txt

      - name: Install dependencies
        run: pip install -r reference_catalogs/requirements.txt pytest

      - name: Run offline tests
        run: python -m pytest tests/test_reference_catalogs.py -q

      - name: Build catalogs
        run: |
          ONLY_ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ONLY_ARGS="--only ${{ github.event.inputs.only }}"
          fi
          python -m reference_catalogs.build_all_reference_catalogs --out "$OUT_DIR" --allow-partial $ONLY_ARGS

      - name: Attach built files to this run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reference-catalogs
          path: ${{ env.OUT_DIR }}
          if-no-files-found: warn

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning title=Hugging Face upload skipped::Add the HF_TOKEN repository secret, then re-run this workflow."
            exit 0
          fi
          python -m reference_catalogs.upload_reference_catalogs_to_hub --src "$OUT_DIR" --repo "$HF_REPO"

      - name: Fail if any catalog was not built
        run: |
          python - <<'PY'
          import json, os, sys
          manifest = json.load(open(os.path.join(os.environ["OUT_DIR"], "build_manifest.json")))
          for name, info in manifest["catalogs"].items():
              print(f"built  {name}: {info['rows']} rows")
          for name, error in manifest["failed"].items():
              print(f"FAILED {name}: {error}")
          sys.exit(1 if manifest["failed"] else 0)
          PY
